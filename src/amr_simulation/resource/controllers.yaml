controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

diffdrive_controller:
  ros__parameters:
    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    wheel_separation: 0.40
    wheel_radius: 0.075

    wheel_separation_multiplier: 1.096  # calibrated: Webots tyre contact is near the outer wheel edge (effective track ~0.44 m)
    wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint

    enable_odom_tf: true
    open_loop: false

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.5
        min_velocity: -0.5
        has_acceleration_limits: true
        max_acceleration: 0.4
        max_deceleration: -0.4
        max_acceleration_reverse: -0.4
        max_deceleration_reverse: 0.4

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.0
        max_deceleration: -1.0
        max_acceleration_reverse: -1.0
        max_deceleration_reverse: 1.0
